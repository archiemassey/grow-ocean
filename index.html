<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a2e44" />
  <meta name="app-release" content="grow-ocean-v13" />
  <meta name="description" content="gROW Ocean — offline companion for the Atlantic row." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    /* Set the saved screen mode before first paint to avoid a flash. */
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('theme') || '"auto"');
        if (['auto', 'day', 'dark', 'night'].indexOf(t) < 0) t = 'auto';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'auto'); }
    })();
  </script>
  <title>gROW Ocean</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="iconbtn" hidden aria-label="Back">‹</button>
      <h1 id="topTitle">gROW&nbsp;Ocean</h1>
      <button id="themeBtn" class="iconbtn" aria-label="Screen mode">◐</button>
      <span id="netStatus" class="net" title="Connection status">offline-ready</span>
    </header>

    <a id="shiftStrip" class="shift-strip" href="#/home" title="Open Home shift controls">Loading shift…</a>

    <section id="updateBanner" class="update-banner card" hidden aria-label="App update">
      <p id="updateMessage" role="status" aria-live="polite"></p>
      <button id="updateReload" class="btn small secondary" disabled>I've saved my work — reload app</button>
    </section>

    <main id="view" class="view" tabindex="-1"><!-- views render here --></main>

    <footer id="primaryDock" class="primary-dock">
    <nav class="tabbar" id="tabbar" aria-label="Primary">
      <a href="#/home" class="tab" data-tab="home"><span class="ico">⌂</span><span>Home</span></a>
      <a href="#/boat" class="tab" data-tab="boat"><span class="ico">⚓</span><span>Boat</span></a>
      <a href="#/log" class="tab" data-tab="log"><span class="ico">🎙</span><span>Log</span></a>
      <a href="#/entertain" class="tab" data-tab="entertain" aria-label="Entertainment"><span class="ico">★</span><span>Entertainment</span></a>
    </nav>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="dimOverlay" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
